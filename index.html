
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Practical Code Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="wrap">
        <h1>OS Practical Code Library</h1>
        <p>Select a practical to view its program and viva preparation.</p>
    </div>
</header>

<main class="wrap">
    <aside>
        <input
    type="text"
    class="search"
    id="search"
    placeholder="Search practicals..."
    autocomplete="off"
>
        <div class="nav" id="nav"></div>
    </aside>

    <section class="content" id="content">
        <div class="eyebrow">Your collection</div>
        <h2>Choose a practical</h2>
        <p class="desc">
            Select a practical name to view its code and viva notes.
        </p>
    </section>
</main>

<footer>
    OS Practical and Viva Preparation Website
</footer>

<script src="script.js"></script>
</body>
</html>
